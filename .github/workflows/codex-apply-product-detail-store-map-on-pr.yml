name: Apply product detail store map on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-product-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/product-detail-store-map
          fetch-depth: 0

      - name: Execute embedded patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/codex-apply-product-detail-store-map.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          exec(compile(script, '<embedded-product-map-patch>', 'exec'))
          PY

          php -l be_laravel/app/Models/StoreProfile.php
          php -l be_laravel/app/Http/Controllers/Api/ApiProductController.php

      - name: Commit generated changes
        shell: bash
        run: |
          rm .github/workflows/codex-apply-product-detail-store-map.yml
          rm .github/workflows/codex-apply-product-detail-store-map-on-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fe_flutter/lib/screens/product_detail_screen.dart \
                  be_laravel/app/Models/StoreProfile.php \
                  be_laravel/app/Http/Controllers/Api/ApiProductController.php \
                  .github/workflows/codex-apply-product-detail-store-map.yml \
                  .github/workflows/codex-apply-product-detail-store-map-on-pr.yml
          git commit -m "feat: show store map on product detail"
          git push origin HEAD:codex/product-detail-store-map
